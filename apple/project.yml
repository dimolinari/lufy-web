name: Lufy
options:
  bundleIdPrefix: com.lufy
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  developmentLanguage: es
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    PRODUCT_NAME: Lufy
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  LufyCore:
    path: .
targets:
  Lufy:
    type: application
    platform: iOS
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
        excludes:
          - Info.plist
          - Lufy.storekit
      - path: ../data
        includes:
          - contenido.json
          - meta.json
        buildPhase: resources
      - path: ../data/app/v1
        buildPhase: resources
        type: folder
    dependencies:
      - package: LufyCore
        product: LufyCore
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LUFY_BUNDLE_IDENTIFIER)
        PRODUCT_NAME: Lufy
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
  LufyCoreTests:
    type: bundle.unit-test
    platform: iOS
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Tests/LufyCoreTests
    dependencies:
      - package: LufyCore
        product: LufyCore
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LUFY_BUNDLE_IDENTIFIER).tests
        PRODUCT_NAME: LufyCoreTests
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        TEST_HOST: ""
        BUNDLE_LOADER: ""
schemes:
  Lufy:
    build:
      targets:
        Lufy: all
        LufyCoreTests: [test]
    run:
      config: Debug
      storeKitConfiguration: App/Lufy.storekit
    test:
      config: Debug
      targets:
        - LufyCoreTests
    archive:
      config: Release
  LufyCoreTests:
    build:
      targets:
        LufyCoreTests: [test]
    test:
      config: Debug
      targets:
        - LufyCoreTests
