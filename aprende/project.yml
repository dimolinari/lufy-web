# El nombre visible, los bundle id y el team salen de
# Sources/AprendeCore/Resources/brand.json.
# Actualízalos con: python3 scripts/sync_brand.py
name: LufyAprende
options:
  bundleIdPrefix: com.lufy
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
    visionOS: "2.0"
  developmentLanguage: es
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: XXXXXXXXXX # team
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  AprendeCore:
    path: .
targets:
  LufyAprende:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: AprendeCore
        product: AprendeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lufy.aprende # ios-bundle
        PRODUCT_NAME: LufyAprende
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: "Lufy Aprende" # app-name
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
  LufyAprendeMac:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: AprendeCore
        product: AprendeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lufy.aprende.mac # mac-bundle
        PRODUCT_NAME: LufyAprende
        INFOPLIST_KEY_CFBundleDisplayName: "Lufy Aprende" # app-name
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/Info-mac.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: NO
  LufyAprendeVision:
    type: application
    platform: visionOS
    sources:
      - path: App
    dependencies:
      - package: AprendeCore
        product: AprendeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lufy.aprende.vision # vision-bundle
        PRODUCT_NAME: LufyAprende
        INFOPLIST_KEY_CFBundleDisplayName: "Lufy Aprende" # app-name
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/Info-vision.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
schemes:
  LufyAprende:
    build:
      targets:
        LufyAprende: all
    run:
      config: Debug
      storeKitConfiguration: App/Products.storekit
  LufyAprendeMac:
    build:
      targets:
        LufyAprendeMac: all
    run:
      config: Debug
      storeKitConfiguration: App/Products.storekit
  LufyAprendeVision:
    build:
      targets:
        LufyAprendeVision: all
    run:
      config: Debug
      storeKitConfiguration: App/Products.storekit
